    <stop offset="0" stop-color="#00e5ff" stop-opacity="0.18"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .sweep{stroke-dasharray:18 82;animation:sweep 5s linear infinite}
  @keyframes sweep{to{stroke-dashoffset:-100}}
