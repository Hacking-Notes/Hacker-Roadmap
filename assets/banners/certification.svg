<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Roadmap for Certification Seekers">
<title>Roadmap for Certification Seekers</title>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0.10"/><stop offset="0.6" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#7c3aed" fill-opacity="0.18"/>
  </pattern>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="260" rx="16"/></clipPath>
  <clipPath id="type"><rect class="typer" x="78" y="62" width="337" height="28"/></clipPath>
</defs>
<style>
  .typer{transform-box:fill-box;transform-origin:left;animation:type 7s steps(33,end) infinite}
  @keyframes type{0%{transform:scaleX(0)}35%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .cursor{animation:cur 7s steps(33,end) infinite,blink 1s step-end infinite}
  @keyframes cur{0%{transform:translateX(0)}35%,92%{transform:translateX(337px)}100%{transform:translateX(0)}}
  @keyframes blink{50%{opacity:0}}
  .orbit{transform-origin:1040px 140px;animation:spin 14s linear infinite}
  .orbit2{transform-origin:1040px 140px;animation:spin 9s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .fill{transform-box:fill-box;transform-origin:left;animation:fill 7s ease-in-out infinite}
  @keyframes fill{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="260" fill="#ffffff"/>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect x="860" width="340" height="260" fill="url(#dots)"/>
  <rect width="1200" height="36" fill="#f6f8fa"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="600.0" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#59636e">hacker-roadmap — path/certification — PATH 04</text>

  <text x="56" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#7c3aed">$</text>
  <g clip-path="url(#type)"><text x="78" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#1f2328">./roadmap --path certifications</text></g>
  <rect class="cursor" x="80" y="66" width="10" height="21" fill="#7c3aed"/>

  <g>
    <text x="54" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#1f2328">Roadmap for <tspan fill="#7c3aed">Certification Seekers</tspan></text>
    <text x="56" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#59636e">Industry-recognized certs, in the order that makes sense.</text>
  </g>
  <rect x="56" y="196" width="83" height="28" rx="6" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-opacity="0.4"/><text x="97" y="215" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1" fill="#7c3aed">7 CERTS</text><rect x="151" y="196" width="106" height="28" rx="6" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-opacity="0.4"/><text x="204" y="215" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1" fill="#7c3aed">STRUCTURED</text><rect x="269" y="196" width="200" height="28" rx="6" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-opacity="0.4"/><text x="368" y="215" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="1" fill="#7c3aed">COMPTIA · LPI · OFFSEC</text>

  <g class="orbit"><circle cx="1040" cy="140" r="78" fill="none" stroke="#7c3aed" stroke-opacity="0.35" stroke-dasharray="4 10"/><circle cx="1118" cy="140" r="5" fill="#7c3aed"/></g>
  <g class="orbit2"><circle cx="1040" cy="140" r="58" fill="none" stroke="#7c3aed" stroke-opacity="0.25"/><circle cx="982" cy="140" r="3.5" fill="#7c3aed"/></g>
  <circle cx="1040" cy="140" r="42" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.6"/>
  <g class="float"><g transform="translate(1040 140)"><g transform="scale(1.05)"><path d="M-10 -22 L-4 -6 M10 -22 L4 -6" stroke="#7c3aed" stroke-width="3.05" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="7" r="14" stroke="#7c3aed" stroke-width="3.05" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -1 L2.6 4.4 L8.5 5.2 L4.2 9.3 L5.3 15.2 L0 12.4 L-5.3 15.2 L-4.2 9.3 L-8.5 5.2 L-2.6 4.4 Z" stroke="#7c3aed" stroke-width="3.05" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>

  <rect x="0" y="256" width="1200" height="4" fill="#d0d7de"/>
  <rect class="fill" x="0" y="256" width="1200" height="4" fill="url(#bar)"/>
  <rect x="1" y="1" width="1198" height="258" rx="16" fill="none" stroke="#7c3aed" stroke-opacity="0.3"/>
</g>
</svg>
